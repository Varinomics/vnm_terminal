name: CI Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing release tag to receive generated packages
        required: false
        type: string
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  release:
    types: [ published ]

# A release event and a manually dispatched recovery run can target the same
# release tag while carrying different refs. Serialize by the asset target, not
# the triggering ref, so two valid runs cannot upload --clobber over one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_tag == '' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release
  LINUX_SYSTEM_DEPS: >-
    libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev
    libxi-dev libxext-dev libwayland-dev libxkbcommon-dev libvulkan-dev
    libdbus-1-3 libegl1 libglib2.0-0t64 libopengl0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-render-util0 libxcb-shape0 libxcb-xkb1 libxkbcommon-x11-0
    fontconfig fonts-dejavu-core fonts-liberation

jobs:
  # Every build, package and test job below checks out the dependency commits
  # this job resolves, so one workflow run builds one source. Ordinary CI still
  # resolves master fresh on every run: a surface break has to fail app CI on
  # the next run, which is the reason app CI tracks master at all.
  resolve-dependencies:
    name: Resolve dependency commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      surface: ${{ steps.resolve.outputs.surface }}
      chrome: ${{ steps.resolve.outputs.chrome }}
      msdf_text: ${{ steps.resolve.outputs.msdf_text }}
      resolved_from: ${{ steps.resolve.outputs.resolved_from }}

    steps:
      # A release or dispatched run must read the lock from the tagged commit
      # rather than from the workflow ref, for the same reason the signing job
      # checks the release source out by tag.
      - name: Checkout app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}
          persist-credentials: false

      # Every dependency repository is public, so the run needs no credential
      # beyond the workflow token and a fork pull request resolves exactly as
      # a branch push does.
      - name: Resolve dependency commits
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_FROM: ${{ (github.event_name == 'release' || inputs.release_tag != '') && 'lock' || 'master' }}
          STALE_LOCK_IS_FATAL: ${{ github.event_name == 'release' && '1' || '0' }}
        run: node tools/dependencies_lock.js resolve .

  build-and-test:
    name: Qt Quick Terminal (Linux)
    needs: resolve-dependencies
    runs-on: ubuntu-24.04

    steps:
      # persist-credentials is off on every checkout below: actions/checkout
      # otherwise leaves its credential in the checkout's git config until the
      # post-job step, and the build in between runs repository-controlled
      # CMake and scripts from several repositories. Nothing here authenticates
      # to a remote - the only git use is local - so no checkout needs it.
      - name: Checkout app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vnm_terminal
          persist-credentials: false

      - name: Checkout surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: imakris/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          DEPENDENCY_COMMITS: ${{ toJSON(needs.resolve-dependencies.outputs) }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${LINUX_SYSTEM_DEPS}

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          archives: 'icu qtbase qtdeclarative'
          cache: 'true'

      - name: Configure CMake
        run: |
          cmake -B vnm_terminal/build -S vnm_terminal \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_terminal_surface" \
            -DVNM_QML_CHROME_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_qml_chrome" \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build vnm_terminal/build --config ${CMAKE_BUILD_TYPE} --parallel

      - name: Run tests
        working-directory: vnm_terminal/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

  transcript-build-and-test:
    name: Qt Quick Terminal Transcript (Linux)
    needs: resolve-dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vnm_terminal
          persist-credentials: false

      - name: Checkout surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: imakris/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          DEPENDENCY_COMMITS: ${{ toJSON(needs.resolve-dependencies.outputs) }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${LINUX_SYSTEM_DEPS}

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          archives: 'icu qtbase qtdeclarative'
          cache: 'true'

      - name: Configure CMake
        run: |
          cmake -B vnm_terminal/build-transcript -S vnm_terminal \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_terminal_surface" \
            -DVNM_QML_CHROME_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_qml_chrome" \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DVNM_TERMINAL_ENABLE_TRANSCRIPT_CAPTURE_REPLAY=ON \
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build vnm_terminal/build-transcript --config ${CMAKE_BUILD_TYPE} --parallel

      - name: Run tests
        working-directory: vnm_terminal/build-transcript
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --output-on-failure

  package:
    name: AppImage, DEB, and RPM (Linux x64)
    needs: resolve-dependencies
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: vnm_terminal
          persist-credentials: false

      - name: Checkout surface
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: imakris/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      - name: Checkout MSDF text
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: imakris/vnm_msdf_text
          path: vnm_msdf_text
          ref: ${{ needs.resolve-dependencies.outputs.msdf_text }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          DEPENDENCY_COMMITS: ${{ toJSON(needs.resolve-dependencies.outputs) }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      # A dispatched run checks the application out at the workflow ref, which
      # is independent of the release_tag input, so without this a build from
      # one branch can be signed and uploaded to a release cut from another.
      # Resolve the tag and refuse the run unless it names the commit that was
      # actually built. A release event needs no check: its checkout already is
      # the tag's commit.
      - name: Verify the dispatched release tag names this build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_ref="repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          tag_sha="$(gh api "${tag_ref}" --jq '.object.sha')"
          # An annotated tag's ref names the tag object, not the commit.
          if [[ "$(gh api "${tag_ref}" --jq '.object.type')" == "tag" ]]; then
            tag_sha="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          built_sha="$(git -C vnm_terminal rev-parse HEAD)"
          if [[ "${tag_sha}" != "${built_sha}" ]]; then
            echo "Release tag ${RELEASE_TAG} names ${tag_sha}," >&2
            echo "but this run built ${built_sha}." >&2
            exit 1
          fi
          echo "Release tag ${RELEASE_TAG} names the built commit ${built_sha}."

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${LINUX_SYSTEM_DEPS} \
            appstream desktop-file-utils dpkg-dev rpm

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.11.1'
          arch: 'linux_gcc_64'
          archives: 'icu qtbase qtdeclarative'
          cache: 'true'

      - name: Prepare MSDF package dependency
        run: |
          msdf_package_prefix="${GITHUB_WORKSPACE}/msdf_package"
          msdf_package_build_dir="${GITHUB_WORKSPACE}/msdf_package_build"
          freetype_source_dir="${GITHUB_WORKSPACE}/_deps/freetype-src"
          msdfgen_source_dir="${GITHUB_WORKSPACE}/_deps/msdfgen-src"

          git clone --depth 1 --branch VER-2-13-3 \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            "${freetype_source_dir}"
          git clone --depth 1 --branch v1.12.1 \
            https://github.com/Chlumsky/msdfgen.git \
            "${msdfgen_source_dir}"

          cmake -S "${freetype_source_dir}" -B "${msdf_package_build_dir}/freetype" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON \
            -DFT_ENABLE_ERROR_STRINGS=OFF
          cmake --build "${msdf_package_build_dir}/freetype" --target install --parallel

          cmake -S "${msdfgen_source_dir}" -B "${msdf_package_build_dir}/msdfgen" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DCMAKE_PREFIX_PATH="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DMSDFGEN_USE_VCPKG=OFF \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DMSDFGEN_DISABLE_SVG=ON \
            -DMSDFGEN_DISABLE_PNG=ON \
            -DMSDFGEN_USE_SKIA=OFF \
            -DMSDFGEN_CORE_ONLY=OFF \
            -DMSDFGEN_INSTALL=ON
          cmake --build "${msdf_package_build_dir}/msdfgen" --target install --parallel

          cmake -S vnm_msdf_text -B "${msdf_package_build_dir}/vnm_msdf_text" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DCMAKE_PREFIX_PATH="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVNM_MSDF_TEXT_FETCH_DEPS=OFF \
            -DVNM_MSDF_TEXT_BUILD_TESTS=OFF
          cmake --build "${msdf_package_build_dir}/vnm_msdf_text" --target install --parallel

      - name: Configure package build
        run: |
          cmake -B vnm_terminal/build-package -S vnm_terminal \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/msdf_package" \
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_terminal_surface" \
            -DVNM_QML_CHROME_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_qml_chrome" \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DVNM_TERMINAL_ENABLE_MSDF_TEXT_RENDERER=ON \
            -DVNM_TERMINAL_MSDF_TEXT_RENDERER_USE_SYSTEM_LIBS=ON \
            -DVNM_TERMINAL_ENABLE_TRANSCRIPT_CAPTURE_REPLAY=OFF \
            -DVNM_TERMINAL_DISTRIBUTION_BUILD=ON \
            -DVNM_TERMINAL_BUILD_PACKAGES=ON \
            -DBUILD_TESTING=ON

      - name: Build and test package configuration
        run: |
          cmake --build vnm_terminal/build-package --config ${CMAKE_BUILD_TYPE} --parallel
          QT_QPA_PLATFORM=offscreen \
            ctest --test-dir vnm_terminal/build-package --output-on-failure

      - name: Validate Linux desktop metadata
        run: |
          desktop-file-validate \
            vnm_terminal/packaging/linux/com.varinomics.vnm-terminal.desktop
          appstreamcli validate --no-net \
            vnm_terminal/packaging/linux/com.varinomics.vnm-terminal.metainfo.xml

      - name: Stage and smoke-test installed application
        run: |
          app_dir="${GITHUB_WORKSPACE}/vnm_terminal/AppDir"
          DESTDIR="${app_dir}" cmake --install vnm_terminal/build-package \
            --config ${CMAKE_BUILD_TYPE} \
            --prefix /usr \
            --component vnm_terminal_runtime

          test -x "${app_dir}/usr/bin/vnm_terminal"
          test -f "${app_dir}/usr/bin/qt.conf"
          install_libdir="$(
            sed -n 's/^CMAKE_INSTALL_LIBDIR:PATH=//p' \
              vnm_terminal/build-package/CMakeCache.txt
          )"
          test -n "${install_libdir}"
          test -d \
            "${app_dir}/usr/${install_libdir}/vnm_terminal/qml/QtQuick/Controls/Basic"
          QT_QPA_PLATFORM=offscreen \
            "${app_dir}/usr/bin/vnm_terminal" --help >/tmp/vnm_terminal_help.txt

      - name: Build Linux packages
        run: |
          package_version="$(
            sed -nE 's/^project\(vnm_terminal .* VERSION ([^ )]+)\).*/\1/p' \
              vnm_terminal/CMakeLists.txt
          )"
          if [[ -z "${package_version}" ]]; then
            echo "Could not derive package version." >&2
            exit 1
          fi

          cpack -G DEB --config vnm_terminal/build-package/CPackConfig.cmake
          cpack -G RPM --config vnm_terminal/build-package/CPackConfig.cmake

          app_dir="${GITHUB_WORKSPACE}/vnm_terminal/AppDir"
          linuxdeploy="${RUNNER_TEMP}/linuxdeploy-x86_64.AppImage"
          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "${linuxdeploy}"
          chmod +x "${linuxdeploy}"
          APPIMAGE_EXTRACT_AND_RUN=1 \
            "${linuxdeploy}" \
            --appdir "${app_dir}" \
            --executable "${app_dir}/usr/bin/vnm_terminal" \
            --desktop-file "${app_dir}/usr/share/applications/com.varinomics.vnm-terminal.desktop" \
            --icon-file "${app_dir}/usr/share/icons/hicolor/256x256/apps/com.varinomics.vnm-terminal.png"
          install -m 755 vnm_terminal/packaging/linux/AppRun "${app_dir}/AppRun"

          appimagetool="${RUNNER_TEMP}/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output "${appimagetool}"
          chmod +x "${appimagetool}"

          appimage="${GITHUB_WORKSPACE}/vnm_terminal/dist/vnm_terminal_v${package_version}_x86_64.AppImage"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 \
            "${appimagetool}" "${app_dir}" "${appimage}"
          appimage_dir="$(dirname "${appimage}")"
          appimage_name="$(basename "${appimage}")"
          (
            cd "${appimage_dir}"
            sha256sum "${appimage_name}" > "${appimage_name}.sha256"
          )
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 \
            "${appimage}" --help >/tmp/vnm_terminal_appimage_help.txt

      - name: Build and test Linux Qt IFW installer
        run: |
          ifw_root="${RUNNER_TEMP}/QtInstallerFramework/4.7"
          vnm_terminal/tools/provision_linux_ifw.sh \
            --destination "${ifw_root}"
          vnm_terminal/tools/build_linux_ifw_installer.sh \
            --payload "${GITHUB_WORKSPACE}/vnm_terminal/AppDir" \
            --ifw-root "${ifw_root}"

          installer="$(find vnm_terminal/dist -maxdepth 1 -type f \
            -name 'vnm_terminal_v*_linux_x64.run' -print -quit)"
          test -n "${installer}"
          sudo "${installer}" \
            --root /opt/vnm_terminal \
            --accept-licenses \
            --confirm-command \
            install
          test -L /usr/local/bin/vnm_terminal
          test -f \
            /usr/local/share/applications/com.varinomics.vnm-terminal.desktop
          QT_QPA_PLATFORM=offscreen \
            /usr/local/bin/vnm_terminal --help \
              >/tmp/vnm_terminal_ifw_help.txt
          sudo /opt/vnm_terminal/vnm_terminal_maintenance \
            --confirm-command \
            purge
          test ! -e /opt/vnm_terminal
          test ! -e /usr/local/bin/vnm_terminal
          test ! -e \
            /usr/local/share/applications/com.varinomics.vnm-terminal.desktop

      - name: Upload Linux package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vnm-terminal-linux-x64
          path: |
            vnm_terminal/dist/*.AppImage
            vnm_terminal/dist/*.deb
            vnm_terminal/dist/*.rpm
            vnm_terminal/dist/*.run
            vnm_terminal/dist/*.sha256
          if-no-files-found: error

  attach-release-packages:
    name: Attach Linux packages
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Linux package artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vnm-terminal-linux-x64
          path: dist

      - name: Attach Linux packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "${RELEASE_TAG}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
