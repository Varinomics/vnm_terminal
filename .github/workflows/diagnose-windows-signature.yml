name: Diagnose Windows signature probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signature-probe:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout the release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 442686b226838e21f3c607a2dd9960f3aa02142f
          persist-credentials: false

      - name: Capture the first signature probe and run the unchanged fixture
        shell: pwsh
        run: |
          $diagnosticPath = Join-Path $env:RUNNER_TEMP 'vnm-signature-diagnostic.ps1'
          @'
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:GITHUB_WORKSPACE 'packaging/windows/ifw/replacement_support.ps1')
          $originalProbe = (Get-Item Function:Get-VnmTerminalReplacementSignature).ScriptBlock.ToString()
          $condition = 'if ($process.ExitCode -ne 0 -or $errors.Result -ne '''') {'
          if (-not $originalProbe.Contains($condition)) {
              throw 'The expected release probe diagnostic boundary was not found.'
          }
          $observation = '[pscustomobject]@{ Path = $Path; ExitCode = $process.ExitCode; Stdout = $output.Result; Stderr = $errors.Result } | ConvertTo-Json -Compress | Write-Host; '
          $diagnosticProbe = [scriptblock]::Create($originalProbe.Replace($condition, $observation + $condition))
          $fixtureRoot = Join-Path $env:RUNNER_TEMP ('signature-probe-' + [guid]::NewGuid().ToString('N'))
          [void][IO.Directory]::CreateDirectory($fixtureRoot)
          $malformedImage = Join-Path $fixtureRoot 'vnm_terminal_maintenance.exe'
          [IO.File]::WriteAllText($malformedImage, 'unsigned synthetic signature fixture')
          $nativeImage = Join-Path ([Environment]::SystemDirectory) 'WindowsPowerShell/v1.0/powershell.exe'
          $probeFailed = $false
          foreach ($imagePath in @($malformedImage, $nativeImage)) {
              try {
                  & $diagnosticProbe $imagePath | ConvertTo-Json -Compress | Write-Host
              }
              catch {
                  $probeFailed = $true
                  Write-Host ('Probe failure: ' + $_.Exception.Message)
              }
          }
          Write-Host 'Running the unchanged release replacement fixture after the observations.'
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/windows_ifw_replacement_tests.ps1')
          if ($probeFailed) {
              throw 'A diagnostic probe failed; a later warmed fixture pass does not clear that failure.'
          }
          '@ | Set-Content -LiteralPath $diagnosticPath -Encoding utf8
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
              -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $diagnosticPath
          exit $LASTEXITCODE
