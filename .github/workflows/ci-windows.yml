name: CI Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the signed installer and portable zip
        required: false
        type: string
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  release:
    types: [ published ]

# Release-event and manual recovery runs can target the same release tag while
# carrying different refs. Serialize by the asset target, not by the triggering
# ref, so two valid runs cannot upload --clobber over one another concurrently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_tag == '' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CMAKE_BUILD_TYPE: Release
  # Microsoft Artifact Signing (formerly Trusted Signing) identifiers. These are
  # public account identifiers, not credentials; authentication is an OIDC token
  # minted per run, so no key material is stored in the repository.
  ARTIFACT_SIGNING_CLIENT_VERSION: 1.0.128
  TRUSTED_SIGNING_ENDPOINT: https://eus.codesigning.azure.net
  TRUSTED_SIGNING_ACCOUNT: varinomicscodesign
  TRUSTED_SIGNING_PROFILE: varinomics-public-trust

jobs:
  # Every build, package and test job below checks out the dependency commits
  # this job resolves, so one workflow run builds one source. Ordinary CI still
  # resolves master fresh on every run: a surface break has to fail app CI on
  # the next run, which is the reason app CI tracks master at all.
  resolve-dependencies:
    name: Resolve dependency commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      application: ${{ steps.resolve.outputs.application }}
      surface: ${{ steps.resolve.outputs.surface }}
      chrome: ${{ steps.resolve.outputs.chrome }}
      msdf_text: ${{ steps.resolve.outputs.msdf_text }}
      qt_dispatch: ${{ steps.resolve.outputs.qt_dispatch }}
      fonts: ${{ steps.resolve.outputs.fonts }}
      freetype: ${{ steps.resolve.outputs.freetype }}
      msdfgen: ${{ steps.resolve.outputs.msdfgen }}
      source_tuple: ${{ steps.resolve.outputs.source_tuple }}

    steps:
      # A release or dispatched run must read the lock from the tagged commit
      # rather than from the workflow ref, for the same reason the signing job
      # checks the release source out by tag.
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: >-
            ${{ github.event_name == 'release' &&
                format('refs/tags/{0}', github.event.release.tag_name) ||
                inputs.release_tag != '' &&
                format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false

      # The dependency checkouts below carry the repository-read token where one
      # exists and fall back to the workflow token, so this resolution takes the
      # same credential: a repository that becomes private again must not stop
      # every job of all three workflows at the first one while the checkouts
      # still hold a credential that would work. A fork pull request sees no
      # secret and resolves with the workflow token, exactly as a branch push
      # does while every dependency repository is public.
      - name: Resolve dependency commits
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
        run: |
          # The resolver derives release state from GitHub's event payload. A
          # tag cut before this lock existed carries neither the lock
          # nor the program that reads it, and node would report a missing
          # module that names neither the tag nor the reason.
          if [[ ! -f release/dependencies.lock.json ]]; then
            echo "The checked-out release source carries no release/dependencies.lock.json." >&2
            echo "A tag cut before the dependency lock existed cannot be rebuilt by this workflow:" >&2
            echo "there is nothing at that tag recording which dependency commits it was built from." >&2
            exit 1
          fi
          node tools/dependencies_lock.js resolve .

  build-and-test:
    name: Qt Quick Terminal (Windows)
    needs: resolve-dependencies
    runs-on: windows-2025-vs2026
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_MAXSIZE: 2GiB
      CCACHE_COMPILERCHECK: content

    steps:
      # persist-credentials is off on every checkout below: actions/checkout
      # otherwise leaves its credential in the checkout's git config until the
      # post-job step, and the build in between runs repository-controlled
      # CMake and scripts from several repositories. Nothing here authenticates
      # to a remote - the only git use is local - so no checkout needs it.
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vnm_terminal
          ref: ${{ needs.resolve-dependencies.outputs.application }}
          persist-credentials: false

      - name: Load installer recipe from the workflow commit
        shell: pwsh
        env:
          PACKAGING_RECIPE_COMMIT: ${{ github.workflow_sha }}
        run: |
          $recipeRoot = Join-Path $env:RUNNER_TEMP 'vnm-terminal-installer-recipe'
          # A missing local recipe is expected for tagged rebuilds; inspect Git's exit codes below.
          $PSNativeCommandUseErrorActionPreference = $false
          git -C vnm_terminal cat-file -e "$($env:PACKAGING_RECIPE_COMMIT)^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
              git -C vnm_terminal fetch --no-tags --depth=1 origin "$env:PACKAGING_RECIPE_COMMIT"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C vnm_terminal worktree add --detach $recipeRoot "$env:PACKAGING_RECIPE_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDOWS_INSTALLER_RECIPE_ROOT=$recipeRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer recipe: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:PACKAGING_RECIPE_COMMIT"

      - name: Checkout surface
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      - name: Checkout MSDF text
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_msdf_text
          path: vnm_msdf_text
          ref: ${{ needs.resolve-dependencies.outputs.msdf_text }}
          persist-credentials: false

      - name: Checkout Qt dispatch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qt_dispatch
          path: vnm_qt_dispatch
          ref: ${{ needs.resolve-dependencies.outputs.qt_dispatch }}
          persist-credentials: false

      - name: Checkout fonts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_fonts
          path: vnm_fonts
          ref: ${{ needs.resolve-dependencies.outputs.fonts }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      - name: Verify Visual Studio 2026 toolchain
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $instances = @(& $vswhere -latest -products '*' -version '[18.0,19.0)' `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -format json | ConvertFrom-Json)
          if ($instances.Count -ne 1 -or !$instances[0].isComplete -or !$instances[0].isLaunchable) {
              throw 'A complete, launchable Visual Studio 2026 installation is required.'
          }
          $vs = $instances[0].installationPath
          $tools = Get-ChildItem -LiteralPath "$vs/VC/Tools/MSVC" -Directory |
              Where-Object Name -Like '14.51.*' | Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1
          if (!$tools) { throw 'MSVC v145 14.51 is required.' }
          $instances[0] | Select-Object installationPath, installationVersion, isComplete, isLaunchable |
              ConvertTo-Json
          [ordered]@{
              CBS = Test-Path 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/Component Based Servicing/RebootPending'
              WindowsUpdate = Test-Path 'HKLM:/SOFTWARE/Microsoft/Windows/CurrentVersion/WindowsUpdate/Auto Update/RebootRequired'
              PendingFileRename = $null -ne (Get-ItemProperty `
                  'HKLM:/SYSTEM/CurrentControlSet/Control/Session Manager' `
                  -Name PendingFileRenameOperations -ErrorAction SilentlyContinue)
          } | ConvertTo-Json
          "VS2026_PATH=$vs" >> $env:GITHUB_ENV
          "MSVC_COMPILER_DIR=$($tools.FullName)/bin/Hostx64/x64" >> $env:GITHUB_ENV

      - name: Install and identify compiler cache
        id: compiler_cache
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          $root = Join-Path $env:RUNNER_TEMP 'ccache'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne
              '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4') {
              throw 'Compiler cache archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $cacheExe = @(Get-ChildItem -LiteralPath $root -Filter ccache.exe -Recurse)
          if ($cacheExe.Count -ne 1) { throw 'Expected one compiler cache executable.' }
          $cacheExe = $cacheExe[0]
          $cacheExe.DirectoryName >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP/vnm-terminal-ccache" >> $env:GITHUB_ENV
          $fingerprint = Join-Path $env:RUNNER_TEMP 'compiler-cache-toolchain.txt'
          Get-FileHash -Algorithm SHA256 -LiteralPath `
              "$env:MSVC_COMPILER_DIR/cl.exe", "$env:MSVC_COMPILER_DIR/c1.dll", `
              "$env:MSVC_COMPILER_DIR/c1xx.dll", "$env:MSVC_COMPILER_DIR/c2.dll", $cacheExe.FullName |
              ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content $fingerprint
          & $cacheExe.FullName --version | Tee-Object -FilePath $fingerprint -Append
          Get-Content -LiteralPath $fingerprint
          $hash = (Get-FileHash -LiteralPath $fingerprint -Algorithm SHA256).Hash.ToLowerInvariant()
          "key_prefix=$env:RUNNER_OS-$env:RUNNER_ARCH-terminal-ccache-msvc-v145-$env:CMAKE_BUILD_TYPE-$hash-" >> $env:GITHUB_OUTPUT

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.compiler_cache.outputs.key_prefix }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      # The v145 linker accepts these prebuilt MSVC Qt import libraries.
      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_msvc2022_64'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qtshadertools'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      # Hosted CMake has no FASTBuild generator; Ninja supports compiler launchers.
      - name: Configure CMake
        shell: cmd
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          cmake -B vnm_terminal/build -S vnm_terminal ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE% ^
            -DCMAKE_C_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_CXX_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_terminal_surface" ^
            -DVNM_QML_CHROME_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qml_chrome" ^
            -DVNM_TERMINAL_MSDF_TEXT_RENDERER_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_msdf_text" ^
            -DVNM_QT_DISPATCH_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qt_dispatch" ^
            -DVNM_FONTS_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_fonts" ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DBUILD_TESTING=ON
          if errorlevel 1 exit /b 1

      - name: Verify configured MSVC compilers
        shell: pwsh
        run: |
          $expected = "$env:VS2026_PATH/VC/Tools/MSVC/14.51.".Replace('\', '/')
          $cache = Get-Content -LiteralPath 'vnm_terminal/build/CMakeCache.txt'
          foreach ($language in 'C', 'CXX') {
              $entries = @($cache | Where-Object { $_ -match "^CMAKE_${language}_COMPILER:[^=]+=" })
              if ($entries.Count -ne 1) { throw "Missing $language compiler in CMake cache." }
              $compiler = ($entries[0] -split '=', 2)[1].Replace('\', '/')
              if (!$compiler.StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Unexpected $language compiler: $compiler"
              }
              Write-Host $entries[0]
          }

      - name: Build
        shell: cmd
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          cmake --build vnm_terminal/build --config %CMAKE_BUILD_TYPE% --parallel 4

      # Application tests stay tied to the tagged source. The one installer
      # source contract runs separately against the recipe that will be packed.
      - name: Run application tests
        shell: cmd
        working-directory: vnm_terminal/build
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          ctest --output-on-failure -C %CMAKE_BUILD_TYPE% -E "^vnm_terminal_windows_ifw_contract$"

      - name: Run installer recipe tests
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tests/windows_ifw_contract_tests.ps1" `
            -SourceRoot "$env:WINDOWS_INSTALLER_RECIPE_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create source archive
        shell: pwsh
        working-directory: vnm_terminal
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/create_source_archive.ps1

      - name: Prepare source archive build
        shell: pwsh
        run: |
          $archive = Get-ChildItem -Path vnm_terminal/dist -Filter 'vnm_terminal_v*_source.zip' | Select-Object -First 1
          if (-not $archive) {
              throw 'Source archive was not created.'
          }

          $extractDir = Join-Path $env:RUNNER_TEMP 'vnm_terminal_source_extract'
          $buildDir = Join-Path $env:RUNNER_TEMP 'vnm_terminal_source_build'
          Remove-Item -LiteralPath $extractDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $buildDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $extractDir | Out-Null
          Expand-Archive -Path $archive.FullName -DestinationPath $extractDir -Force

          $roots = @(Get-ChildItem -Path $extractDir -Directory)
          if ($roots.Count -ne 1) {
              throw "Expected exactly one source root in archive, found $($roots.Count)."
          }
          $sourceRoot = $roots[0].FullName
          "ARCHIVE_SOURCE_DIR=$sourceRoot" >> $env:GITHUB_ENV
          "ARCHIVE_BUILD_DIR=$buildDir" >> $env:GITHUB_ENV

      - name: Configure source archive build
        shell: cmd
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          cmake -B "%ARCHIVE_BUILD_DIR%" -S "%ARCHIVE_SOURCE_DIR%" ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE% ^
            -DCMAKE_C_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_CXX_COMPILER="%VCToolsInstallDir%bin/Hostx64/x64/cl.exe" ^
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW ^
            -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded ^
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_terminal_surface" ^
            -DVNM_QML_CHROME_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qml_chrome" ^
            -DVNM_TERMINAL_MSDF_TEXT_RENDERER_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_msdf_text" ^
            -DVNM_QT_DISPATCH_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_qt_dispatch" ^
            -DVNM_FONTS_SOURCE_DIR="%GITHUB_WORKSPACE%/vnm_fonts" ^
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF ^
            -DBUILD_TESTING=ON
          if errorlevel 1 exit /b 1

      - name: Verify configured MSVC compilers
        shell: pwsh
        run: |
          $expected = "$env:VS2026_PATH/VC/Tools/MSVC/14.51.".Replace('\', '/')
          $cache = Get-Content -LiteralPath "$env:ARCHIVE_BUILD_DIR/CMakeCache.txt"
          foreach ($language in 'C', 'CXX') {
              $entries = @($cache | Where-Object { $_ -match "^CMAKE_${language}_COMPILER:[^=]+=" })
              if ($entries.Count -ne 1) { throw "Missing $language compiler in CMake cache." }
              $compiler = ($entries[0] -split '=', 2)[1].Replace('\', '/')
              if (!$compiler.StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Unexpected $language compiler: $compiler"
              }
              Write-Host $entries[0]
          }

      - name: Validate source archive build
        shell: cmd
        run: |
          call "%VS2026_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x64 -vcvars_ver=14.51
          if errorlevel 1 exit /b 1
          cmake --build "%ARCHIVE_BUILD_DIR%" --config %CMAKE_BUILD_TYPE% --parallel 4

      - name: Report compiler cache usage
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      - name: Upload source archive artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-source
          path: vnm_terminal/dist/vnm_terminal_v*_source.zip
          if-no-files-found: error

  package:
    name: Portable ZIP and EXE (Windows x64)
    needs: resolve-dependencies
    runs-on: windows-2025-vs2026
    # No signing or repository-write credentials. GitHub still gives the job a
    # read-only GITHUB_TOKEN, and the private surface checkout may receive the
    # repository-read token, but neither identity can reach Microsoft Artifact
    # Signing or alter release assets. This job runs on every push and pull
    # request and executes repository-controlled build scripts and third-party
    # actions, so it must not receive the signing identity. GitHub grants
    # OIDC per job, not per step: every step of a job with id-token: write can
    # ask for a token, whatever `if:` guards the step that uses it. Signing
    # therefore lives in sign-windows-package below, which runs only for a
    # release.

    steps:
      - name: Initialize private Qt IFW paths
        shell: pwsh
        run: |
          $ifwInputRoot = Join-Path $env:RUNNER_TEMP 'vnm-private-ifw-inputs'
          $ifwEngineRoot = Join-Path $env:RUNNER_TEMP 'vnm-private-ifw-engine'
          $ifwRoot = Join-Path $ifwEngineRoot 'build'
          "IFW_INPUT_ROOT=$ifwInputRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IFW_ENGINE_ROOT=$ifwEngineRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "IFW_ROOT=$ifwRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vnm_terminal
          ref: ${{ needs.resolve-dependencies.outputs.application }}
          persist-credentials: false

      - name: Load installer recipe from the workflow commit
        shell: pwsh
        env:
          PACKAGING_RECIPE_COMMIT: ${{ github.workflow_sha }}
        run: |
          $recipeRoot = Join-Path $env:RUNNER_TEMP 'vnm-terminal-installer-recipe'
          # A missing local recipe is expected for tagged rebuilds; inspect Git's exit codes below.
          $PSNativeCommandUseErrorActionPreference = $false
          git -C vnm_terminal cat-file -e "$($env:PACKAGING_RECIPE_COMMIT)^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
              git -C vnm_terminal fetch --no-tags --depth=1 origin "$env:PACKAGING_RECIPE_COMMIT"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C vnm_terminal worktree add --detach $recipeRoot "$env:PACKAGING_RECIPE_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDOWS_INSTALLER_RECIPE_ROOT=$recipeRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer recipe: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:PACKAGING_RECIPE_COMMIT"

      - name: Checkout surface
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          token: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      - name: Checkout MSDF text
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_msdf_text
          path: vnm_msdf_text
          ref: ${{ needs.resolve-dependencies.outputs.msdf_text }}
          persist-credentials: false

      - name: Checkout Qt dispatch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qt_dispatch
          path: vnm_qt_dispatch
          ref: ${{ needs.resolve-dependencies.outputs.qt_dispatch }}
          persist-credentials: false

      - name: Checkout fonts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_fonts
          path: vnm_fonts
          ref: ${{ needs.resolve-dependencies.outputs.fonts }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      - name: Resolve source-built ConPTY inputs
        id: conpty-inputs
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $conptyRoot = Join-Path $env:RUNNER_TEMP 'vnm-conpty'
          "VNM_CONPTY_ROOT=$conptyRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $cacheKey = & pwsh.exe -NoProfile -ExecutionPolicy Bypass `
              -File tools/provision_windows_conpty.ps1 `
              -SourceRoot "$env:GITHUB_WORKSPACE\vnm_terminal_surface" `
              -OutputRoot $conptyRoot -HostedCi -Slots 2 -CacheKeyOnly
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }
          "cache-key=$cacheKey" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore source-built ConPTY package
        id: conpty-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VNM_CONPTY_ROOT }}/package
          key: ${{ runner.os }}-conpty-${{ steps.conpty-inputs.outputs.cache-key }}

      - name: Provision source-built ConPTY package
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          pwsh.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/provision_windows_conpty.ps1 `
            -SourceRoot "$env:GITHUB_WORKSPACE\vnm_terminal_surface" `
            -OutputRoot "$env:VNM_CONPTY_ROOT" -HostedCi -Slots 2
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Save source-built ConPTY package
        if: steps.conpty-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.VNM_CONPTY_ROOT }}/package
          key: ${{ runner.os }}-conpty-${{ steps.conpty-inputs.outputs.cache-key }}

      - name: Restore private Qt IFW inputs
        id: ifw-input-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.IFW_INPUT_ROOT }}
          key: ${{ runner.os }}-vs2026-ifw-inputs-${{ hashFiles('vnm_terminal/packaging/windows/private-ifw/source-lock.json', 'vnm_terminal/packaging/windows/private-ifw/static-inputs.cmake', 'vnm_terminal/packaging/windows/private-ifw/bzip2-static/CMakeLists.txt', 'vnm_terminal/tools/provision_windows_private_ifw_inputs.ps1') }}

      - name: Provision private Qt IFW inputs
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          pwsh.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/provision_windows_private_ifw_inputs.ps1 `
            -OutputRoot "$env:IFW_INPUT_ROOT" -Generator Ninja -Jobs 4
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Save private Qt IFW inputs
        if: steps.ifw-input-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.IFW_INPUT_ROOT }}
          key: ${{ runner.os }}-vs2026-ifw-inputs-${{ hashFiles('vnm_terminal/packaging/windows/private-ifw/source-lock.json', 'vnm_terminal/packaging/windows/private-ifw/static-inputs.cmake', 'vnm_terminal/packaging/windows/private-ifw/bzip2-static/CMakeLists.txt', 'vnm_terminal/tools/provision_windows_private_ifw_inputs.ps1') }}

      - name: Restore private Qt IFW engine
        id: ifw-engine-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.IFW_ENGINE_ROOT }}
          key: ${{ runner.os }}-vs2026-ifw-engine-${{ hashFiles('vnm_terminal/packaging/windows/private-ifw/**', 'vnm_terminal/tools/build_windows_private_ifw.ps1', 'vnm_terminal/tools/provision_windows_private_ifw_inputs.ps1', 'vnm_terminal/tools/prepare_windows_private_ifw_source.ps1') }}

      - name: Build private Qt IFW engine
        if: steps.ifw-engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          pwsh.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/build_windows_private_ifw.ps1 `
            -QtIfwRepositoryPath "$env:IFW_INPUT_ROOT\sources\ifw" `
            -QtRoot "$env:IFW_INPUT_ROOT\qt" `
            -XzRoot "$env:IFW_INPUT_ROOT\xz" `
            -Bzip2Root "$env:IFW_INPUT_ROOT\bzip2" `
            -InputMaterialRoot "$env:IFW_INPUT_ROOT\source-material" `
            -OutputRoot "$env:IFW_ENGINE_ROOT" `
            -HostedBuild -Jobs 1
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Verify private Qt IFW engine
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/assert_windows_private_ifw.ps1 -IfwRoot "$env:IFW_ROOT"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Save private Qt IFW engine
        if: steps.ifw-engine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.IFW_ENGINE_ROOT }}
          key: ${{ runner.os }}-vs2026-ifw-engine-${{ hashFiles('vnm_terminal/packaging/windows/private-ifw/**', 'vnm_terminal/tools/build_windows_private_ifw.ps1', 'vnm_terminal/tools/provision_windows_private_ifw_inputs.ps1', 'vnm_terminal/tools/prepare_windows_private_ifw_source.ps1') }}

      - name: Validate Qt IFW packaging contract
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tests/windows_ifw_contract_tests.ps1" `
            -SourceRoot "$env:WINDOWS_INSTALLER_RECIPE_ROOT" -IfwRoot "$env:IFW_ROOT"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.12.0'
          arch: 'win64_mingw'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qtshadertools'
          cache: 'true'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b'

      # Qt's tool repository does not publish GCC 15.1. Use the same upstream
      # MinGW-Builds toolchain as the local portable build.
      - name: Install MinGW 15.1
        id: mingw
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mingw1510.7z'
          $root    = Join-Path $env:RUNNER_TEMP 'mingw1510'
          $url = 'https://github.com/niXman/mingw-builds-binaries/releases/download/' +
              '15.1.0-rt_v12-rev0/x86_64-15.1.0-release-posix-seh-msvcrt-rt_v12-rev0.7z'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expectedHash = 'ba447149a73cab43fdaf3352d1164f2bd5e96bc01ae6564fbaebd62f1b8eb435'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'MinGW 15.1 archive checksum mismatch.'
          }
          7z.exe x $archive "-o$root" -y -mmt1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $root 'mingw64/bin'
          $version = & (Join-Path $bin 'g++.exe') -dumpfullversion
          if ($LASTEXITCODE -ne 0 -or $version -ne '15.1.0') {
              throw "Expected MinGW GCC 15.1.0, found $version."
          }
          "bin=$bin" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install and identify compiler cache
        id: compiler_cache
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ccache.zip'
          $root = Join-Path $env:RUNNER_TEMP 'ccache'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne
              '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4') {
              throw 'Compiler cache archive checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root
          $cacheExe = @(Get-ChildItem -LiteralPath $root -Filter ccache.exe -Recurse)
          if ($cacheExe.Count -ne 1) { throw 'Expected one compiler cache executable.' }
          $cacheExe = $cacheExe[0]
          $cacheExe.DirectoryName >> $env:GITHUB_PATH
          "CCACHE_DIR=$env:RUNNER_TEMP/vnm-terminal-ccache" >> $env:GITHUB_ENV
          $fingerprint = Join-Path $env:RUNNER_TEMP 'compiler-cache-toolchain.txt'
          Get-FileHash -Algorithm SHA256 -LiteralPath `
              '${{ steps.mingw.outputs.bin }}/gcc.exe', '${{ steps.mingw.outputs.bin }}/g++.exe', $cacheExe.FullName |
              ForEach-Object { "$($_.Hash) $($_.Path)" } | Set-Content $fingerprint
          & $cacheExe.FullName --version | Tee-Object -FilePath $fingerprint -Append
          Get-Content -LiteralPath $fingerprint
          $hash = (Get-FileHash -LiteralPath $fingerprint -Algorithm SHA256).Hash.ToLowerInvariant()
          "key_prefix=$env:RUNNER_OS-$env:RUNNER_ARCH-terminal-ccache-mingw-$env:CMAKE_BUILD_TYPE-$hash-" >> $env:GITHUB_OUTPUT

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.compiler_cache.outputs.key_prefix }}

      - name: Reset compiler cache statistics
        run: ccache --zero-stats

      - name: Write package build configuration
        shell: pwsh
        run: |
          $config = @(
              '@echo off',
              "set QT_PREFIX=$env:QT_ROOT_DIR",
              "set MINGW_BIN=${{ steps.mingw.outputs.bin }}",
              "set CMAKE=$((Get-Command cmake.exe).Source)",
              "set NINJA=$((Get-Command ninja.exe).Source)",
              "set VNM_TERMINAL_SURFACE_SOURCE_DIR=$env:GITHUB_WORKSPACE\vnm_terminal_surface",
              "set VNM_TERMINAL_CONPTY_PACKAGE_DIR=$env:VNM_CONPTY_ROOT\package",
              "set VNM_QML_CHROME_SOURCE_DIR=$env:GITHUB_WORKSPACE\vnm_qml_chrome",
              "set VNM_MSDF_TEXT_SOURCE_DIR=$env:GITHUB_WORKSPACE\vnm_msdf_text",
              "set VNM_QT_DISPATCH_SOURCE_DIR=$env:GITHUB_WORKSPACE\vnm_qt_dispatch",
              "set VNM_FONTS_SOURCE_DIR=$env:GITHUB_WORKSPACE\vnm_fonts",
              "set FREETYPE_COMMIT=${{ needs.resolve-dependencies.outputs.freetype }}",
              "set MSDFGEN_COMMIT=${{ needs.resolve-dependencies.outputs.msdfgen }}",
              "set IFW_ROOT=$env:IFW_ROOT"
          )
          [System.IO.File]::WriteAllLines(
              "$env:GITHUB_WORKSPACE\vnm_terminal\build_config.bat",
              $config,
              [System.Text.Encoding]::ASCII)

      - name: Build Windows portable payload
        shell: pwsh
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 2GiB
          CCACHE_COMPILERCHECK: content
        working-directory: vnm_terminal
        run: cmd.exe /d /c build_portable.bat

      - name: Report compiler cache usage
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: ccache --show-stats --verbose

      - name: Save compiler cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      - name: Capture and build the unsigned installer recipe
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          & "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tools/windows_installer_recipe.ps1" `
              -Mode Capture -RecipeRoot dist/installer-recipe `
              -SourceRoot "$env:WINDOWS_INSTALLER_RECIPE_ROOT" `
              -PackagingCommit '${{ github.workflow_sha }}'
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File dist/installer-recipe/tools/build_windows_ifw_installer.ps1 `
              -PayloadPath dist/portable_candidate -OutputDirectory dist `
              -IfwRoot "$env:IFW_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate installer and packaged runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path vnm_terminal/dist `
              -Filter 'vnm_terminal_v*_windows_x64_unsigned.exe' |
              Select-Object -First 1
          if (-not $installer) {
              throw 'Qt IFW installer was not created.'
          }

          $installerHelp = & $installer.FullName --help 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0 -or
              $installerHelp -notmatch 'Qt Installer Framework') {
              throw 'The generated Qt IFW installer did not provide its command-line help.'
          }

          $packagePayload = 'vnm_terminal/dist/portable_candidate'
          $launcher = Join-Path $packagePayload 'vnm_terminal.exe'
          $runtime = Join-Path $packagePayload 'vnm_terminal_runtime\vnm_terminal.exe'
          $windowsPlugin = Join-Path $packagePayload `
              'vnm_terminal_runtime\platforms\qwindows.dll'
          foreach ($requiredFile in @($launcher, $runtime, $windowsPlugin)) {
              if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
                  throw "Installed payload is missing $requiredFile"
              }
          }

          foreach ($executable in @($launcher, $runtime)) {
              $process = Start-Process -FilePath $executable `
                  -ArgumentList '--help' -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                  throw "$executable --help failed with exit code $($process.ExitCode)."
              }
          }

      - name: Exercise generated Qt IFW installation lifecycle
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $installer = Get-ChildItem -Path dist `
              -Filter 'vnm_terminal_v*_windows_x64_unsigned.exe' |
              Select-Object -First 1
          if (-not $installer) {
              throw 'Qt IFW installer was not created.'
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tests/windows_ifw_installation_tests.ps1 `
            -InstallerPath $installer.FullName
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Inspect expanded portable ZIP
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $archive = Get-ChildItem -Path dist -Filter 'vnm_terminal_v*_w64.zip' |
              Select-Object -First 1
          & "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tests/windows_portable_payload_tests.ps1" `
              -PayloadPath dist/portable_candidate -ArchivePath $archive.FullName

      # The contract test's artifact-level assertions need a built installer, so
      # they cannot run in the source-only pass above. Without this step the
      # checksum sidecar convention is declared and never exercised.
      - name: Validate the packaged artifact checksum contract
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $installer = Get-ChildItem -Path dist `
              -Filter 'vnm_terminal_v*_windows_x64_unsigned.exe' |
              Select-Object -First 1
          if (-not $installer) {
              throw 'Qt IFW installer was not created.'
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tests/windows_ifw_contract_tests.ps1" `
            -SourceRoot "$env:WINDOWS_INSTALLER_RECIPE_ROOT" `
            -ArtifactPath $installer.FullName
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Record Windows package provenance
        shell: pwsh
        working-directory: vnm_terminal
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
          THIRD_PARTY_CHECKOUTS: >-
            {"freetype":"vnm_terminal/build_portable/_deps/freetype-src",
            "msdfgen":"vnm_terminal/build_portable/_deps/msdfgen-src"}
          RELEASE_TAG: >-
            ${{ github.event_name == 'release' &&
                github.event.release.tag_name || inputs.release_tag || '' }}
          QT_VERSION: '6.12.0'
          QT_IFW_VERSION: '4.11.0'
        run: |
          node tools/dependencies_lock.js record-provenance `
            . "$env:GITHUB_WORKSPACE" `
            dist/vnm_terminal_windows_x64_build_provenance.json `
            dist/portable_candidate

      - name: Upload unsigned Windows package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-windows-x64-unsigned
          path: |
            vnm_terminal/dist/vnm_terminal_v*_w64.zip
            vnm_terminal/dist/vnm_terminal_v*_windows_x64_unsigned.exe
            vnm_terminal/dist/vnm_terminal_v*_windows_x64_unsigned.exe.sha256
            vnm_terminal/dist/vnm_terminal_windows_x64_build_provenance.json
          if-no-files-found: error

      - name: Archive installer corresponding source
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $installer = Get-ChildItem dist -Filter 'vnm_terminal_v*_windows_x64_unsigned.exe' |
              Select-Object -First 1
          $archiveName = $installer.Name.Replace('_windows_x64_unsigned.exe', '_windows_installer_source.zip')
          $archivePath = Join-Path (Resolve-Path dist) $archiveName
          Compress-Archive -Path @("$env:IFW_ENGINE_ROOT\source-material\*", 'dist/installer-recipe') `
              -DestinationPath $archivePath -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archivePath.sha256", "$hash  $archiveName`n", [Text.Encoding]::ASCII)

      - name: Upload installer corresponding source
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-windows-installer-source
          path: |
            vnm_terminal/dist/vnm_terminal_v*_windows_installer_source.zip
            vnm_terminal/dist/vnm_terminal_v*_windows_installer_source.zip.sha256
          if-no-files-found: error

      - name: Upload the release signing payload
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-windows-x64-signing-payload
          path: |
            vnm_terminal/dist/portable_candidate
            vnm_terminal/dist/installer-recipe
            vnm_terminal/dist/payload.sha256
            vnm_terminal/dist/vnm_terminal_windows_x64_build_provenance.json
          if-no-files-found: error
          # The manifest is taken with -Force, so the upload has to carry the
          # same set or verification fails on a file that was never sent.
          include-hidden-files: true
          # Keep the repository's default retention here. The signing job may
          # wait for environment approval, and a one-day expiry can delete its
          # only input while that run is still legitimately pending. The separate
          # retention workflow removes superseded artifacts after their owning
          # runs have completed.

      - name: Upload the release installer engine
        if: ${{ github.event_name == 'release' || inputs.release_tag != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-windows-installer-engine
          path: |
            ${{ env.IFW_ROOT }}/bin/installerbase.exe
            ${{ env.IFW_ROOT }}/bin/binarycreator.exe
            ${{ env.IFW_ROOT }}/bin/devtool.exe
            ${{ env.IFW_ROOT }}/bin/repogen.exe
            ${{ env.IFW_ROOT }}/vnm-terminal-ifw-provenance.json
          if-no-files-found: error

  # Everything with access to the signing credential lives here, and nothing
  # else does. Every action below is pinned to a full commit SHA because a
  # moving tag inside this job is a moving tag next to the only credential in
  # the repository; the SHAs are the commits those tags named when the job was
  # written and want re-auditing before each release. The job deliberately does
  # not check out the surface or chrome repositories, install Qt, compile the
  # application, or run its test suite. It does check out the app release source
  # and execute the audited IFW verification and packaging scripts needed to
  # repackage the already-built payload, so those scripts remain inside the
  # credential boundary and need the same review as the pinned actions.
  #
  # The release-signing environment stays on this job. It exists to give the
  # OIDC token a stable subject: a release run's ref is refs/tags/<tag>, which
  # changes every release, so a ref-scoped federated credential would need
  # recreating each time, while the environment subject stays
  # repo:Varinomics/vnm_terminal:environment:release-signing.
  #
  # That environment deliberately carries no protection rules. This is a
  # decision, not an omission, and it is recorded here because it reads like a
  # gap and is repeatedly reported as one.
  #
  # Required reviewers would be self-approval. The repository has one
  # collaborator and one organization member, and they are the same admin who
  # publishes the release, so the gate would ask the person who triggered the
  # run to approve it seconds later. That is friction on every release in
  # exchange for refusing nothing.
  #
  # A deployment branch and tag restriction cannot be added without removing
  # the recovery path. Those rules match github.ref. A release event runs at
  # refs/tags/<tag>, while the workflow_dispatch recovery this job also serves
  # runs at refs/heads/master, so a tag pattern that admits the release blocks
  # the dispatch. Admitting master back defeats the rule, because a wrong edit
  # to this workflow lands on master, which is the case the restriction was
  # meant to cover. Tag-only protection and manual recovery are mutually
  # exclusive, and the recovery path is what re-signs a release whose signing
  # job failed without burning a version number.
  #
  # What the boundary rests on instead is the if: condition below, which keeps
  # this job off pushes and pull requests, and GitHub refusing environment
  # access and id-token: write to a pull request from a fork, so outside code
  # cannot mint this token however this file is written. Do not add
  # pull_request_target here: it runs forked code in this repository's own
  # context, where that last protection no longer applies.
  #
  # Revisit the decision when any of these change: a second identity gains
  # write access, the workflow_dispatch signing path is retired, or the
  # packaging scripts named above stop being reviewed as credential-boundary
  # code.
  sign-windows-package:
    name: Sign Windows installer
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    # A release must pass the complete Windows build/test/source-integrity gate,
    # not only the packaging job that produced the payload. Otherwise a failing
    # test run can coexist with a newly signed and published installer.
    needs: [resolve-dependencies, build-and-test, package]
    runs-on: windows-2022
    environment: release-signing
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Initialize private Qt IFW paths
        shell: pwsh
        run: |
          $ifwRoot = Join-Path $env:RUNNER_TEMP 'vnm-private-ifw-engine'
          "IFW_ROOT=$ifwRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Checkout the release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vnm_terminal
          ref: ${{ needs.resolve-dependencies.outputs.application }}
          persist-credentials: false

      - name: Load installer recipe from the workflow commit
        shell: pwsh
        env:
          PACKAGING_RECIPE_COMMIT: ${{ github.workflow_sha }}
        run: |
          $recipeRoot = Join-Path $env:RUNNER_TEMP 'vnm-terminal-installer-recipe'
          # A missing local recipe is expected for tagged rebuilds; inspect Git's exit codes below.
          $PSNativeCommandUseErrorActionPreference = $false
          git -C vnm_terminal cat-file -e "$($env:PACKAGING_RECIPE_COMMIT)^{commit}" 2>$null
          if ($LASTEXITCODE -ne 0) {
              git -C vnm_terminal fetch --no-tags --depth=1 origin "$env:PACKAGING_RECIPE_COMMIT"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git -C vnm_terminal worktree add --detach $recipeRoot "$env:PACKAGING_RECIPE_COMMIT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "WINDOWS_INSTALLER_RECIPE_ROOT=$recipeRoot" | Out-File `
              -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Installer recipe: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/tree/$env:PACKAGING_RECIPE_COMMIT"

      - name: Download the release signing payload
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-windows-x64-signing-payload
          path: vnm_terminal/dist

      - name: Verify the signing payload
        shell: pwsh
        working-directory: vnm_terminal
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
        run: |
          node tools/dependencies_lock.js verify-signing-input `
            . dist/vnm_terminal_windows_x64_build_provenance.json `
            dist/portable_candidate

      - name: Verify the installer recipe
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          & "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tools/windows_installer_recipe.ps1" `
              -Mode Verify -RecipeRoot dist/installer-recipe `
              -SourceRoot "$env:WINDOWS_INSTALLER_RECIPE_ROOT" `
              -PackagingCommit '${{ github.workflow_sha }}'

      # Reuse the package job's exact engine. Compilation and dependency
      # downloads remain outside the signing credential boundary.
      - name: Download the release installer engine
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-windows-installer-engine
          path: ${{ env.IFW_ROOT }}

      - name: Verify private Qt IFW engine
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/assert_windows_private_ifw.ps1 -IfwRoot "$env:IFW_ROOT"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # Acquire and locate the client before establishing an Azure session. This
      # does not remove the job-level OIDC capability - only a separate job can
      # do that - but it avoids exposing an already-authenticated Azure CLI cache
      # to package retrieval and extraction.
      - name: Acquire Microsoft Artifact Signing client
        shell: pwsh
        run: |
          $clientRoot = Join-Path $env:RUNNER_TEMP 'artifact-signing-client'
          New-Item -ItemType Directory -Path $clientRoot -Force | Out-Null
          nuget.exe install Microsoft.ArtifactSigning.Client `
              -Version $env:ARTIFACT_SIGNING_CLIENT_VERSION `
              -Source https://api.nuget.org/v3/index.json `
              -OutputDirectory $clientRoot `
              -ExcludeVersion `
              -NoCache `
              -NonInteractive
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

          $dlib = Join-Path $clientRoot `
              'Microsoft.ArtifactSigning.Client\bin\x64\Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib)) {
              throw "Artifact Signing dlib was not found at $dlib."
          }

          $signTool = Get-ChildItem `
              -Path 'C:\Program Files (x86)\Windows Kits\10\bin' `
              -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*\x64\*' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          if (-not $signTool) {
              throw 'signtool.exe was not found in the Windows SDK.'
          }

          # No secrets here: endpoint, account and profile are public identifiers.
          # The following azure/login step establishes the OIDC-backed credential
          # before this metadata is consumed by signtool.
          $metadata = [ordered]@{
              Endpoint               = $env:TRUSTED_SIGNING_ENDPOINT
              CodeSigningAccountName = $env:TRUSTED_SIGNING_ACCOUNT
              CertificateProfileName = $env:TRUSTED_SIGNING_PROFILE
              CorrelationId          = $env:GITHUB_RUN_ID
              # azure/login establishes the Azure CLI session used below.
              # Fail closed instead of allowing DefaultAzureCredential to probe
              # runner-local or future credential sources unexpectedly.
              ExcludeCredentials     = @(
                  'EnvironmentCredential',
                  'ManagedIdentityCredential',
                  'WorkloadIdentityCredential',
                  'SharedTokenCacheCredential',
                  'VisualStudioCredential',
                  'VisualStudioCodeCredential',
                  'AzurePowerShellCredential',
                  'AzureDeveloperCliCredential',
                  'InteractiveBrowserCredential'
              )
          }
          $metadataPath = Join-Path $env:RUNNER_TEMP 'artifact-signing-metadata.json'
          $metadata | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $metadataPath -Encoding utf8

          "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_DLIB_PATH=$dlib"             | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_METADATA_PATH=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Authenticate to Azure for signing
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.TRUSTED_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.TRUSTED_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.TRUSTED_SIGNING_SUBSCRIPTION_ID }}

      # Signing repackages rather than post-signing the unsigned installer on
      # purpose: build_windows_ifw_installer.ps1 signs vnm_terminal.exe, the
      # maintenance tool and the installer base *before* binarycreator runs, so
      # signing only the finished exe would ship a signed installer that
      # installs unsigned binaries. The payload is already built, so this
      # repackages rather than recompiles.
      - name: Build signed Windows installer
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File dist/installer-recipe/tools/build_windows_ifw_installer.ps1 `
            -PayloadPath dist/portable_candidate -OutputDirectory dist `
            -IfwRoot "$env:IFW_ROOT" `
            -SignToolPath "$env:SIGNTOOL_PATH" `
            -TrustedSigningDlibPath "$env:SIGNING_DLIB_PATH" `
            -TrustedSigningMetadataPath "$env:SIGNING_METADATA_PATH"
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      - name: Build signed portable archive
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $payload = (Resolve-Path -LiteralPath 'dist/portable_candidate').Path
          $buildInfo = Join-Path $payload `
              'vnm_terminal_runtime\vnm_terminal_build_info.txt'
          $versionLine = Get-Content -LiteralPath $buildInfo |
              Where-Object { $_ -match '^Version:\s*(?<version>[0-9]+(?:\.[0-9]+)+)\s*$' } |
              Select-Object -First 1
          if (-not $versionLine) {
              throw "Could not derive the portable archive version from $buildInfo."
          }
          [void]($versionLine -match `
              '^Version:\s*(?<version>[0-9]+(?:\.[0-9]+)+)\s*$')

          $archiveName = "vnm_terminal_v$($Matches.version)_w64.zip"
          $archivePath = Join-Path (Resolve-Path -LiteralPath 'dist').Path `
              $archiveName
          Remove-Item -LiteralPath $archivePath -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "$archivePath.sha256" -Force `
              -ErrorAction SilentlyContinue
          Compress-Archive -Path (Join-Path $payload '*') `
              -DestinationPath $archivePath -Force

          $hash = (Get-FileHash -LiteralPath $archivePath `
              -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
              "$archivePath.sha256",
              "$hash  $archiveName`n",
              [System.Text.ASCIIEncoding]::new())
          & "$env:WINDOWS_INSTALLER_RECIPE_ROOT/tests/windows_portable_payload_tests.ps1" `
              -PayloadPath $payload -ArchivePath $archivePath

      - name: Verify the installer is signed
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path vnm_terminal/dist `
              -Filter 'vnm_terminal_v*_windows_x64.exe' |
              Where-Object { $_.Name -notlike '*_unsigned.exe' } |
              Select-Object -First 1
          if (-not $installer) {
              throw 'Signed installer was not produced.'
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') {
              throw "Installer signature is $($signature.Status), expected Valid."
          }
          if (-not $signature.TimeStamperCertificate) {
              throw 'Installer signature is not timestamped; it would stop verifying when the certificate expires.'
          }

          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
          Write-Host "Timestamped by: $($signature.TimeStamperCertificate.Subject)"

      - name: Upload signed Windows package artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-windows-x64-signed
          path: |
            vnm_terminal/dist/vnm_terminal_v*_w64.zip
            vnm_terminal/dist/vnm_terminal_v*_w64.zip.sha256
            vnm_terminal/dist/vnm_terminal_v*_windows_x64.exe
            vnm_terminal/dist/vnm_terminal_v*_windows_x64.exe.sha256
            vnm_terminal/dist/vnm_terminal_windows_x64_build_provenance.json
          if-no-files-found: error

  # The package job installs and uninstalls the unsigned installer, but signing
  # rebuilds it, so the artifact that actually ships is not the one that was
  # exercised. Run the same lifecycle against the signed installer here rather
  # than in the signing job: this job has no credentials, so running the
  # repository's own test script against the release build costs nothing that
  # the signing job would have had to pay.
  verify-signed-package:
    name: Verify signed installer lifecycle
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [resolve-dependencies, sign-windows-package]
    runs-on: windows-2022
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout the release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vnm_terminal
          ref: ${{ needs.resolve-dependencies.outputs.application }}
          persist-credentials: false

      - name: Download signed Windows package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-windows-x64-signed
          path: vnm_terminal/dist

      - name: Verify the signed package source provenance
        working-directory: vnm_terminal
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
        run: |
          node tools/dependencies_lock.js verify-provenance \
            . dist/vnm_terminal_windows_x64_build_provenance.json

      - name: Exercise the signed Qt IFW installation lifecycle
        shell: pwsh
        working-directory: vnm_terminal
        run: |
          $installer = Get-ChildItem -Path dist `
              -Filter 'vnm_terminal_v*_windows_x64.exe' |
              Where-Object { $_.Name -notlike '*_unsigned.exe' } |
              Select-Object -First 1
          if (-not $installer) {
              throw 'Signed installer was not downloaded.'
          }

          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tests/windows_ifw_installation_tests.ps1 `
            -InstallerPath $installer.FullName `
            -RequireSigned
          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

  attach-source-archive:
    name: Attach source archive (release)
    if: github.event_name == 'release'
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download source archive artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-source
          path: dist

      - name: Attach source archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(find dist -maxdepth 1 -name 'vnm_terminal_v*_source.zip' -print -quit)"
          if [[ -z "${archive}" ]]; then
            echo "Source archive artifact was not downloaded." >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${archive}" --repo "${GITHUB_REPOSITORY}" --clobber

  attach-release-packages:
    name: Attach Windows packages
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [sign-windows-package, verify-signed-package]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download signed Windows package artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-windows-x64-signed
          path: dist

      - name: Download installer corresponding source
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vnm-terminal-windows-installer-source
          path: dist

      - name: Attach Windows packages to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # GITHUB_REF_NAME is the branch on a dispatched run, so the tag has to
          # come from the release event or the dispatch input.
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            dist/vnm_terminal_v*_w64.zip \
            dist/vnm_terminal_v*_w64.zip.sha256 \
            dist/vnm_terminal_v*_windows_x64.exe \
            dist/vnm_terminal_v*_windows_x64.exe.sha256 \
            dist/vnm_terminal_v*_windows_installer_source.zip \
            dist/vnm_terminal_v*_windows_installer_source.zip.sha256 \
            dist/vnm_terminal_windows_x64_build_provenance.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
