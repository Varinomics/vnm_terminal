name: Contribution coverage

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Contribution review relay]
    types: [completed]
  push:
    branches: [contribution-records]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Optional open PR number; blank rechecks every open PR
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  contribution-coverage:
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && startsWith(github.event.comment.body, '/cla '))) &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request_review')
    uses: Varinomics/vnm_terminal_surface/.github/workflows/check-contributions.yml@master
    with:
      pull_request: ${{ inputs.pull_request || '' }}
