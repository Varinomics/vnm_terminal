name: CI macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the macOS bundle
        required: false
        type: string
      validation:
        description: Full validation or a focused native check
        type: choice
        default: full
        options: [full, custom-titlebar, keyboard]
  push:
    branches: [ master, main, dev ]
  pull_request:
    branches: [ master, main, dev ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' && inputs.release_tag == '' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # Every build, package and test job below checks out the dependency commits
  # this job resolves, so one workflow run builds one source. Ordinary CI still
  # resolves master fresh on every run: a surface break has to fail app CI on
  # the next run, which is the reason app CI tracks master at all.
  resolve-dependencies:
    name: Resolve dependency commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      application: ${{ steps.resolve.outputs.application }}
      surface: ${{ steps.resolve.outputs.surface }}
      chrome: ${{ steps.resolve.outputs.chrome }}
      msdf_text: ${{ steps.resolve.outputs.msdf_text }}
      qt_dispatch: ${{ steps.resolve.outputs.qt_dispatch }}
      fonts: ${{ steps.resolve.outputs.fonts }}
      freetype: ${{ steps.resolve.outputs.freetype }}
      msdfgen: ${{ steps.resolve.outputs.msdfgen }}
      source_tuple: ${{ steps.resolve.outputs.source_tuple }}
      macos_x64_artifact_name: ${{ steps.package.outputs.macos_x64_artifact_name }}
      macos_arm64_artifact_name: ${{ steps.package.outputs.macos_arm64_artifact_name }}

    steps:
      - name: Validate focused request
        if: inputs.validation != 'full' && inputs.validation != '' && inputs.release_tag != ''
        run: |
          echo "Focused validation cannot attach a release bundle." >&2
          exit 1

      # A release or dispatched run must read the lock from the tagged commit
      # rather than from the workflow ref, for the same reason the signing job
      # checks the release source out by tag.
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: >-
            ${{ github.event_name == 'release' &&
                format('refs/tags/{0}', github.event.release.tag_name) ||
                inputs.release_tag != '' &&
                format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false

      # The dependency checkouts below carry the repository-read token where one
      # exists and fall back to the workflow token, so this resolution takes the
      # same credential: a repository that becomes private again must not stop
      # every job of all three workflows at the first one while the checkouts
      # still hold a credential that would work. A fork pull request sees no
      # secret and resolves with the workflow token, exactly as a branch push
      # does while every dependency repository is public.
      - name: Resolve dependency commits
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.VARINOMICS_REPO_READ_TOKEN || github.token }}
        run: |
          # The resolver derives release state from GitHub's event payload. A
          # tag cut before this lock existed carries neither the lock
          # nor the program that reads it, and node would report a missing
          # module that names neither the tag nor the reason.
          if [[ ! -f release/dependencies.lock.json ]]; then
            echo "The checked-out release source carries no release/dependencies.lock.json." >&2
            echo "A tag cut before the dependency lock existed cannot be rebuilt by this workflow:" >&2
            echo "there is nothing at that tag recording which dependency commits it was built from." >&2
            exit 1
          fi
          node tools/dependencies_lock.js resolve .

      - name: Derive package names
        id: package
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [[ -n "${RELEASE_TAG}" ]]; then
            package_version="${RELEASE_TAG#v}"
          else
            package_version="$(
              sed -nE 's/^project\(vnm_terminal .* VERSION ([^ )]+)\).*/\1/p' CMakeLists.txt
            )"
          fi

          if [[ -z "${package_version}" ]]; then
            echo "Could not derive package version." >&2
            exit 1
          fi

          echo "macos_x64_artifact_name=vnm_terminal_v${package_version}_macos_x64_unnotarized" >> "${GITHUB_OUTPUT}"
          echo "macos_arm64_artifact_name=vnm_terminal_v${package_version}_macos_arm64_unnotarized" >> "${GITHUB_OUTPUT}"

  build-and-test:
    name: Qt Quick Terminal (macOS ${{ matrix.architecture }})
    needs: resolve-dependencies
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.validation == 'custom-titlebar' &&
              '[{"architecture":"x64","cmake_architecture":"x86_64","runner":"macos-15-intel"}]' ||
              inputs.validation == 'keyboard' &&
              '[{"architecture":"arm64","cmake_architecture":"arm64","runner":"macos-15"}]' ||
              '[{"architecture":"x64","cmake_architecture":"x86_64","runner":"macos-15-intel"},
                {"architecture":"arm64","cmake_architecture":"arm64","runner":"macos-15"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_ARCHITECTURE: ${{ matrix.cmake_architecture }}
      MACOSX_DEPLOYMENT_TARGET: '14.4'
      PACKAGE_NAME: ${{ needs.resolve-dependencies.outputs[format('macos_{0}_artifact_name', matrix.architecture)] }}
      CCACHE_MAXSIZE: 2GiB
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache

    steps:
      - name: Verify native build host
        run: test "$(uname -m)" = "${MACOS_ARCHITECTURE}"

      # persist-credentials is off on every checkout below: actions/checkout
      # otherwise leaves its credential in the checkout's git config until the
      # post-job step, and the build in between runs repository-controlled
      # CMake and scripts from several repositories. Nothing here authenticates
      # to a remote - the only git use is local - so no checkout needs it.
      - name: Checkout app
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: vnm_terminal
          ref: ${{ needs.resolve-dependencies.outputs.application }}
          persist-credentials: false

      - name: Checkout surface
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_terminal_surface
          path: vnm_terminal_surface
          ref: ${{ needs.resolve-dependencies.outputs.surface }}
          persist-credentials: false

      - name: Checkout chrome
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qml_chrome
          path: vnm_qml_chrome
          ref: ${{ needs.resolve-dependencies.outputs.chrome }}
          persist-credentials: false

      - name: Checkout MSDF text
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_msdf_text
          path: vnm_msdf_text
          ref: ${{ needs.resolve-dependencies.outputs.msdf_text }}
          persist-credentials: false

      - name: Checkout Qt dispatch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_qt_dispatch
          path: vnm_qt_dispatch
          ref: ${{ needs.resolve-dependencies.outputs.qt_dispatch }}
          persist-credentials: false

      - name: Checkout fonts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Varinomics/vnm_fonts
          path: vnm_fonts
          ref: ${{ needs.resolve-dependencies.outputs.fonts }}
          persist-credentials: false

      # The static contract cannot see a checkout it fails to parse, and a ref
      # that resolves to the empty string silently takes a default branch, so
      # the commits this job actually built from are compared with the ones the
      # run resolved.
      - name: Verify the checked-out dependency commits
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
        run: |
          node vnm_terminal/tools/dependencies_lock.js verify-checkout vnm_terminal "${GITHUB_WORKSPACE}"

      # Tagged rebuilds keep their application source intact while using this
      # workflow's packaging checks, including tags that predate the verifier.
      - name: Load bundle verifier from the workflow commit
        env:
          PACKAGING_RECIPE_COMMIT: ${{ github.workflow_sha }}
        run: |
          # Avoid a network dependency when the exact recipe is already local.
          # Tagged rebuilds may need a different commit from the app checkout.
          if ! git -C vnm_terminal cat-file -e "${PACKAGING_RECIPE_COMMIT}^{commit}" 2>/dev/null; then
            git -C vnm_terminal fetch --no-tags --depth=1 origin "${PACKAGING_RECIPE_COMMIT}"
          fi
          git -C vnm_terminal show "${PACKAGING_RECIPE_COMMIT}:tools/verify_macos_bundle.sh" \
            > "${RUNNER_TEMP}/verify_macos_bundle.sh"
          git -C vnm_terminal show "${PACKAGING_RECIPE_COMMIT}:tests/macos_bundle_verifier_tests.sh" \
            > "${RUNNER_TEMP}/macos_bundle_verifier_tests.sh"
          git -C vnm_terminal show "${PACKAGING_RECIPE_COMMIT}:tools/verify_macos_bundle_runtime.py" \
            > "${RUNNER_TEMP}/verify_macos_bundle_runtime.py"
          git -C vnm_terminal show "${PACKAGING_RECIPE_COMMIT}:tools/inspect_runtime_contents.py" \
            > "${RUNNER_TEMP}/inspect_runtime_contents.py"

      - name: Install and identify compiler cache
        id: compiler_cache
        run: |
          brew install ccache
          echo "CCACHE_DIR=${RUNNER_TEMP}/vnm-terminal-ccache" >> "${GITHUB_ENV}"
          {
            ccache --version
            xcodebuild -version
            xcrun --show-sdk-path
            xcrun --show-sdk-version
            shasum -a 256 "$(xcrun --find clang++)" "$(command -v ccache)"
          } | tee "${RUNNER_TEMP}/compiler-cache-toolchain.txt"
          toolchain_hash=$(shasum -a 256 "${RUNNER_TEMP}/compiler-cache-toolchain.txt" | cut -d ' ' -f 1)
          echo "key_prefix=${RUNNER_OS}-${RUNNER_ARCH}-terminal-ccache-${CMAKE_BUILD_TYPE}-${toolchain_hash}-" >> "${GITHUB_OUTPUT}"

      - name: Restore compiler cache
        id: restore_compiler_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler_cache.outputs.key_prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.compiler_cache.outputs.key_prefix }}

      - name: Initialize compiler cache statistics
        run: ccache --zero-stats

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.12.0'
          arch: 'clang_64'
          archives: 'qtbase qtdeclarative qtsvg'
          modules: 'qtshadertools'
          cache: 'true'

      - name: Prepare MSDF package dependency
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
          THIRD_PARTY_CHECKOUTS: '{"freetype":"_deps/freetype-src","msdfgen":"_deps/msdfgen-src"}'
        run: |
          msdf_package_prefix="${GITHUB_WORKSPACE}/msdf_package"
          msdf_package_build_dir="${GITHUB_WORKSPACE}/msdf_package_build"
          freetype_source_dir="${GITHUB_WORKSPACE}/_deps/freetype-src"
          msdfgen_source_dir="${GITHUB_WORKSPACE}/_deps/msdfgen-src"

          git clone --filter=blob:none --no-checkout \
            https://gitlab.freedesktop.org/freetype/freetype.git \
            "${freetype_source_dir}"
          git -C "${freetype_source_dir}" checkout --detach \
            "${{ needs.resolve-dependencies.outputs.freetype }}"
          git clone --filter=blob:none --no-checkout \
            https://github.com/Chlumsky/msdfgen.git \
            "${msdfgen_source_dir}"
          git -C "${msdfgen_source_dir}" checkout --detach \
            "${{ needs.resolve-dependencies.outputs.msdfgen }}"

          node vnm_terminal/tools/dependencies_lock.js verify-checkout \
            vnm_terminal "${GITHUB_WORKSPACE}"

          cmake -S "${freetype_source_dir}" -B "${msdf_package_build_dir}/freetype" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHITECTURE}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DFT_DISABLE_HARFBUZZ=ON \
            -DFT_DISABLE_BROTLI=ON \
            -DFT_DISABLE_BZIP2=ON \
            -DFT_DISABLE_PNG=ON \
            -DFT_DISABLE_ZLIB=ON \
            -DFT_ENABLE_ERROR_STRINGS=OFF
          cmake --build "${msdf_package_build_dir}/freetype" --target install --parallel 3

          cmake -S "${msdfgen_source_dir}" -B "${msdf_package_build_dir}/msdfgen" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHITECTURE}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DCMAKE_PREFIX_PATH="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DMSDFGEN_USE_VCPKG=OFF \
            -DMSDFGEN_BUILD_STANDALONE=OFF \
            -DMSDFGEN_DISABLE_SVG=ON \
            -DMSDFGEN_DISABLE_PNG=ON \
            -DMSDFGEN_USE_SKIA=OFF \
            -DMSDFGEN_CORE_ONLY=OFF \
            -DMSDFGEN_INSTALL=ON
          cmake --build "${msdf_package_build_dir}/msdfgen" --target install --parallel 3

          cmake -S vnm_msdf_text -B "${msdf_package_build_dir}/vnm_msdf_text" \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHITECTURE}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_INSTALL_PREFIX="${msdf_package_prefix}" \
            -DCMAKE_PREFIX_PATH="${msdf_package_prefix}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DVNM_MSDF_TEXT_FETCH_DEPS=OFF \
            -DVNM_MSDF_TEXT_BUILD_QT_LCD=ON \
            -DVNM_MSDF_TEXT_BUILD_TESTS=OFF
          cmake --build "${msdf_package_build_dir}/vnm_msdf_text" --target install --parallel 3

          test -f "${msdf_package_prefix}/lib/cmake/vnm_msdf_text/vnm_msdf_text-config.cmake"

      - name: Configure CMake
        run: |
          cmake -B vnm_terminal/build -S vnm_terminal \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DCMAKE_OSX_ARCHITECTURES="${MACOS_ARCHITECTURE}" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR};${GITHUB_WORKSPACE}/msdf_package" \
            -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DVNM_TERMINAL_SURFACE_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_terminal_surface" \
            -DVNM_QML_CHROME_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_qml_chrome" \
            -DVNM_TERMINAL_MSDF_TEXT_RENDERER_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_msdf_text" \
            -DVNM_QT_DISPATCH_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_qt_dispatch"             -DVNM_FONTS_SOURCE_DIR="${GITHUB_WORKSPACE}/vnm_fonts" \
            -DVNM_TERMINAL_ENABLE_PROFILING=OFF \
            -DVNM_TERMINAL_ENABLE_MSDF_TEXT_RENDERER=ON \
            -DVNM_TERMINAL_MSDF_TEXT_RENDERER_USE_SYSTEM_LIBS=ON \
            -DVNM_TERMINAL_ENABLE_TRANSCRIPT_CAPTURE_REPLAY=OFF \
            -DVNM_TERMINAL_DISTRIBUTION_BUILD=ON \
            -DBUILD_TESTING=ON

      - name: Build
        id: build
        env:
          VALIDATION: ${{ inputs.validation }}
        run: |
          targets=()
          if [[ "${VALIDATION}" == custom-titlebar ]]; then
            targets=(--target vnm_terminal vnm_terminal_canvas_fixture)
          elif [[ "${VALIDATION}" == keyboard ]]; then
            targets=(--target vnm_terminal_macos_keyboard vnm_terminal_custom_titlebar_integration)
          fi
          cmake --build vnm_terminal/build --config "${CMAKE_BUILD_TYPE}" --parallel 3 "${targets[@]}"

      - name: Report compiler cache usage
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        run: ccache --show-stats --verbose | tee "${RUNNER_TEMP}/compiler-cache-stats.txt"

      # Preserve reusable compilation even when a later test fails.
      - name: Save compiler cache
        if: always() && steps.restore_compiler_cache.outcome == 'success'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore_compiler_cache.outputs.cache-primary-key }}

      - name: Run tests
        id: terminal_tests
        working-directory: vnm_terminal/build
        env:
          QT_QPA_PLATFORM: offscreen
          VALIDATION: ${{ inputs.validation }}
        run: |
          selection=()
          if [[ "${VALIDATION}" == custom-titlebar ]]; then
            selection=(-R '^vnm_terminal_custom_titlebar_smoke$')
          elif [[ "${VALIDATION}" == keyboard ]]; then
            selection=(-R '^vnm_terminal_(macos_keyboard_.*|custom_titlebar_integration)$')
          fi
          ctest --output-on-failure "${selection[@]}"

      - name: Retain focused terminal evidence
        if: always() && inputs.validation == 'custom-titlebar' && steps.terminal_tests.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-macos-custom-titlebar-evidence
          path: |
            vnm_terminal/build/tests/terminal-custom-titlebar-*
            vnm_terminal/build/Testing/Temporary/LastTest.log
          retention-days: 7
          if-no-files-found: error

      - name: Retain native keyboard evidence
        if: always() && inputs.validation == 'keyboard' && steps.terminal_tests.outcome != 'skipped'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vnm-terminal-macos-keyboard-${{ matrix.architecture }}-evidence
          path: |
            vnm_terminal/build/Testing/Temporary/LastTest.log
            ${{ runner.temp }}/compiler-cache-*.txt
          retention-days: 7
          if-no-files-found: error

      - name: Deploy macOS app bundle
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          app_bundle="vnm_terminal/build/vnm_terminal.app"
          test -d "${app_bundle}"
          "${QT_ROOT_DIR}/bin/macdeployqt" "${app_bundle}" \
            -qmldir="${GITHUB_WORKSPACE}/vnm_terminal/packaging" -verbose=2
          # main() selects Basic before any QML loads. Match the Windows runtime
          # deployment while preserving Basic and its shared implementation.
          qml_root="${app_bundle}/Contents/Resources/qml"
          test -d "${qml_root}/QtQuick/Controls/Basic"
          for style in "${qml_root}/QtQuick/Controls/"*; do
            if [[ -d "${style}" && "${style##*/}" != Basic && "${style##*/}" != impl ]]; then
              rm -rf -- "${style}"
            fi
          done
          rm -rf -- "${qml_root}/QtQuick/NativeStyle" \
            "${qml_root}/QtQuick/tooling" "${qml_root}/QtQuick/designer"
          find "${qml_root}" -name '*.qmltypes' -type f -delete

      - name: Test macOS bundle debug-symbol classification
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          bash "${RUNNER_TEMP}/macos_bundle_verifier_tests.sh" \
            "${RUNNER_TEMP}/verify_macos_bundle.sh" \
            vnm_terminal/build/vnm_terminal.app "${MACOS_ARCHITECTURE}"

      - name: Write macOS build info
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          app_bundle="vnm_terminal/build/vnm_terminal.app"
          resources_dir="${app_bundle}/Contents/Resources"
          mkdir -p "${resources_dir}"
          package_version="$(
            sed -nE 's/^project\(vnm_terminal .* VERSION ([^ )]+)\).*/\1/p' \
              vnm_terminal/CMakeLists.txt
          )"
          if [[ -z "${package_version}" ]]; then
            echo "Could not derive package version." >&2
            exit 1
          fi
          app_commit="$(git -C vnm_terminal rev-parse --verify HEAD)"
          app_branch="$(git -C vnm_terminal rev-parse --abbrev-ref HEAD)"
          surface_commit="$(git -C vnm_terminal_surface rev-parse --verify HEAD)"
          surface_branch="$(git -C vnm_terminal_surface rev-parse --abbrev-ref HEAD)"
          chrome_commit="$(git -C vnm_qml_chrome rev-parse --verify HEAD)"
          chrome_branch="$(git -C vnm_qml_chrome rev-parse --abbrev-ref HEAD)"
          app_state=clean
          surface_state=clean
          chrome_state=clean
          if [[ -n "$(git -C vnm_terminal status --porcelain --untracked-files=all)" ]]; then
            app_state=dirty
          fi
          if [[ -n "$(git -C vnm_terminal_surface status --porcelain --untracked-files=all)" ]]; then
            surface_state=dirty
          fi
          if [[ -n "$(git -C vnm_qml_chrome status --porcelain --untracked-files=all)" ]]; then
            chrome_state=dirty
          fi
          timestamp="$(date -u +%Y-%m-%d_%H:%MZ)"
          {
            echo "Build timestamp: ${timestamp}"
            echo "App source:      ${GITHUB_WORKSPACE}/vnm_terminal"
            echo "App branch:      ${app_branch}"
            echo "App commit:      ${app_commit}"
            echo "App tree state:  ${app_state}"
            echo "Surface source:  ${GITHUB_WORKSPACE}/vnm_terminal_surface"
            echo "Surface branch:  ${surface_branch}"
            echo "Surface commit:  ${surface_commit}"
            echo "Surface state:   ${surface_state}"
            echo "Chrome source:   ${GITHUB_WORKSPACE}/vnm_qml_chrome"
            echo "Chrome branch:   ${chrome_branch}"
            echo "Chrome commit:   ${chrome_commit}"
            echo "Chrome state:    ${chrome_state}"
            echo "Version:         ${package_version}"
            echo "Configuration:   ${CMAKE_BUILD_TYPE}"
            echo "Distribution:    ON"
            echo "Profiling:       OFF"
            echo "Transcript:      OFF"
            echo "Toolchain:       clang"
            echo "Architecture:    ${MACOS_ARCHITECTURE}"
            echo "Minimum macOS:   ${MACOSX_DEPLOYMENT_TARGET}"
            echo "Qt:              ${QT_ROOT_DIR}"
          } > "${resources_dir}/vnm_terminal_build_info.txt"

      - name: Record macOS package provenance
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        env:
          SOURCE_TUPLE: ${{ needs.resolve-dependencies.outputs.source_tuple }}
          THIRD_PARTY_CHECKOUTS: '{"freetype":"_deps/freetype-src","msdfgen":"_deps/msdfgen-src"}'
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag || '' }}
          QT_VERSION: '6.12.0'
        run: |
          node vnm_terminal/tools/dependencies_lock.js record-provenance \
            vnm_terminal "${GITHUB_WORKSPACE}" \
            vnm_terminal/build/vnm_terminal.app/Contents/Resources/vnm_terminal_build_provenance.json

      - name: Include application and bundled dependency notices
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          resources_dir="vnm_terminal/build/vnm_terminal.app/Contents/Resources"
          font_notices_dir="${resources_dir}/vnm_fonts"
          mkdir -p "${font_notices_dir}/LICENSES"
          cp vnm_terminal/LICENSE vnm_terminal/THIRD_PARTY_NOTICES.md "${resources_dir}/"
          cp vnm_fonts/THIRD_PARTY_NOTICES.md "${font_notices_dir}/"
          cp vnm_fonts/LICENSES/*.txt "${font_notices_dir}/LICENSES/"
          mkdir -p "${resources_dir}/licenses/freetype" "${resources_dir}/licenses/msdfgen"
          cp _deps/freetype-src/docs/FTL.TXT "${resources_dir}/licenses/freetype/"
          cp _deps/msdfgen-src/LICENSE.txt "${resources_dir}/licenses/msdfgen/"
          cat >> "${resources_dir}/THIRD_PARTY_NOTICES.md" <<'EOF'

          ## macOS static rendering dependencies

          This software is based in part on the work of the FreeType Team.
          FreeType is used under the FreeType Project License; the complete
          license is included in `licenses/freetype/FTL.TXT`.
          Matching source: https://gitlab.freedesktop.org/freetype/freetype/-/tree/${{ needs.resolve-dependencies.outputs.freetype }}

          msdfgen is used under the MIT License. Its complete copyright,
          permission notice and disclaimer are included in `licenses/msdfgen/LICENSE.txt`.
          Matching source: https://github.com/Chlumsky/msdfgen/tree/${{ needs.resolve-dependencies.outputs.msdfgen }}
          EOF

      - name: Sign and validate macOS app bundle
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        id: bundle_validation
        run: |
          app_bundle="vnm_terminal/build/vnm_terminal.app"
          bash "${RUNNER_TEMP}/verify_macos_bundle.sh" "${app_bundle}" "${MACOS_ARCHITECTURE}"
          codesign --force --deep --sign - "${app_bundle}"
          codesign --verify --deep --strict "${app_bundle}"
          QT_QPA_PLATFORM=offscreen "${app_bundle}/Contents/MacOS/vnm_terminal" --help >/tmp/vnm_terminal_help.txt

      - name: Diagnose rejected macOS bundle build inputs
        if: failure() && steps.bundle_validation.outcome == 'failure'
        run: |
          cat vnm_terminal/build/CMakeFiles/vnm_terminal.dir/link.txt
          find vnm_terminal/build msdf_package_build -name flags.make \
            -exec grep -H -E '^(C|CXX)_FLAGS =' {} +

      - name: Package macOS app bundle
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          mkdir -p vnm_terminal/dist
          ditto -c -k --sequesterRsrc --keepParent \
            "vnm_terminal/build/vnm_terminal.app" \
            "vnm_terminal/dist/${PACKAGE_NAME}.zip"

      - name: Validate packed macOS app bundle
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        run: |
          unpack_dir="$(mktemp -d "${RUNNER_TEMP}/macos-package.XXXXXX")"
          ditto -x -k "vnm_terminal/dist/${PACKAGE_NAME}.zip" "${unpack_dir}"
          app_bundle="${unpack_dir}/vnm_terminal.app"
          bash "${RUNNER_TEMP}/verify_macos_bundle.sh" "${app_bundle}" "${MACOS_ARCHITECTURE}"
          codesign --verify --deep --strict "${app_bundle}"
          resources_dir="${app_bundle}/Contents/Resources"
          cmp _deps/freetype-src/docs/FTL.TXT "${resources_dir}/licenses/freetype/FTL.TXT"
          cmp _deps/msdfgen-src/LICENSE.txt "${resources_dir}/licenses/msdfgen/LICENSE.txt"
          grep -Fq 'This software is based in part on the work of the FreeType Team.' \
            "${resources_dir}/THIRD_PARTY_NOTICES.md"
          python3 "${RUNNER_TEMP}/verify_macos_bundle_runtime.py" \
            "${app_bundle}" "${unpack_dir}/runtime-evidence"

      - name: Upload macOS bundle artifact
        if: inputs.validation != 'custom-titlebar' && inputs.validation != 'keyboard'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ needs.resolve-dependencies.outputs[format('macos_{0}_artifact_name', matrix.architecture)] }}
          path: vnm_terminal/dist/${{ env.PACKAGE_NAME }}.zip
          if-no-files-found: error

  attach-release-asset:
    name: Attach macOS Bundle (${{ matrix.architecture }})
    if: >-
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [resolve-dependencies, build-and-test]
    strategy:
      matrix:
        architecture: [x64, arm64]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download macOS bundle artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ${{ needs.resolve-dependencies.outputs[format('macos_{0}_artifact_name', matrix.architecture)] }}
          path: dist

      - name: Attach macOS bundle to GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          PACKAGE_NAME: ${{ needs.resolve-dependencies.outputs[format('macos_{0}_artifact_name', matrix.architecture)] }}
        run: |
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${PACKAGE_NAME}.zip" \
            --repo "${{ github.repository }}" \
            --clobber
