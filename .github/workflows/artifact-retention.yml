name: Retain Latest Artifacts

on:
  workflow_run:
    workflows: [ CI Linux, CI macOS, CI Windows ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    name: Keep latest package artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Delete superseded artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delete_artifact()
          {
              local family="$1"
              local run_id="$2"
              local artifact_id="$3"
              local artifact_name="$4"
              local output

              echo "Deleting superseded ${family} artifact ${artifact_name} from run ${run_id}."
              if output="$(
                  gh api \
                      --method DELETE \
                      "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" 2>&1
              )"; then
                  return
              fi

              # CI Linux, CI macOS and CI Windows each start one of these runs,
              # so siblings prune the same listing concurrently, and an
              # artifact can also expire between the listing and this delete.
              # Absent is the end state this job wants, so a delete that finds
              # nothing has succeeded. Any other failure still fails the job,
              # because a job that cannot delete must not report that it
              # pruned.
              if [[ "${output}" == *"(HTTP 404)"* ]]; then
                  echo "Artifact ${artifact_name} was already gone."
                  return
              fi

              printf '%s\n' "${output}" >&2
              return 1
          }

          # A completed workflow can overlap an older release that is waiting for
          # environment approval or still signing. Its artifacts are visible in
          # the repository-wide listing even though the workflow still needs
          # them. Cache run status lookups and never prune an artifact until its
          # owning workflow is complete.
          declare -A workflow_run_status_cache=()
          workflow_run_status_result=''

          workflow_run_status()
          {
              local run_id="$1"
              local status

              if [[ -n "${workflow_run_status_cache[${run_id}]+present}" ]]; then
                  workflow_run_status_result="${workflow_run_status_cache[${run_id}]}"
                  return
              fi

              status="$(
                  gh api \
                      --method GET \
                      "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                      --jq '.status'
              )"
              if [[ -z "${status}" ]]; then
                  echo "Could not determine the status of workflow run ${run_id}." >&2
                  return 1
              fi

              workflow_run_status_cache["${run_id}"]="${status}"
              workflow_run_status_result="${status}"
          }

          prune_rows()
          {
              local family="$1"
              local rows="$2"
              local completed_rows=''
              local latest_artifact_id
              local run_id artifact_id artifact_name

              if [[ -z "${rows}" ]]; then
                  return
              fi

              while IFS=$'\t' read -r run_id artifact_id artifact_name; do
                  workflow_run_status "${run_id}"
                  if [[ "${workflow_run_status_result}" != 'completed' ]]; then
                      echo "Keeping ${family} artifact ${artifact_name} from active run ${run_id}."
                      continue
                  fi

                  completed_rows+="${run_id}"$'\t'"${artifact_id}"$'\t'"${artifact_name}"$'\n'
              done <<< "${rows}"

              if [[ -z "${completed_rows}" ]]; then
                  return
              fi

              latest_artifact_id="$(
                  printf '%s' "${completed_rows}" |
                      sort -n -k1,1 -k2,2 |
                      tail -n 1 |
                      cut -f2
              )"

              while IFS=$'\t' read -r run_id artifact_id artifact_name; do
                  if [[ -z "${artifact_id}" ||
                        "${artifact_id}" == "${latest_artifact_id}" ]]
                  then
                      continue
                  fi

                  delete_artifact \
                      "${family}" \
                      "${run_id}" \
                      "${artifact_id}" \
                      "${artifact_name}"
              done <<< "${completed_rows}"
          }

          # Windows packaging emits three families: the unsigned build every
          # run produces, the signed build a release produces, and the payload
          # the package job hands the signing job. Pruning by exact name, so a
          # rename here without a rename in ci-windows.yml silently stops
          # pruning rather than failing.
          for artifact_name in \
              vnm-terminal-source \
              vnm-terminal-windows-x64-unsigned \
              vnm-terminal-windows-x64-signed \
              vnm-terminal-windows-x64-signing-payload \
              vnm-terminal-linux-x64
          do
              rows="$(
                  gh api \
                      --paginate \
                      --method GET \
                      "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                      -f "name=${artifact_name}" \
                      --jq '.artifacts[] | [.workflow_run.id, .id, .name] | @tsv'
              )"
              prune_rows "${artifact_name}" "${rows}"
          done

          macos_rows="$(
              gh api \
                  --paginate \
                  --method GET \
                  "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                  --jq '.artifacts[] |
                      select(.name | test("^vnm_terminal_v.*_macos_x64")) |
                      [.workflow_run.id, .id, .name] |
                      @tsv'
          )"
          prune_rows "macOS" "${macos_rows}"
